<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block}
#info{position:fixed;bottom:16px;left:16px;color:#8b949e;font-size:11px;pointer-events:none}
#tooltip{position:fixed;display:none;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;font-size:11px;color:#c9d1d9;pointer-events:none;max-width:300px;z-index:10}
</style></head><body>
<canvas id="c"></canvas>
<div id="info">Loading graph…</div>
<div id="tooltip"></div>
<script>
const COLORS={code:'#58a6ff',document:'#3fb950',session:'#d2a8ff',decision_point:'#f0883e',concept:'#f778ba',default:'#8b949e'};
const TYPE_NAMES={code:'Code',document:'Doc',session:'Session',decision_point:'Decision',concept:'Concept'};

let nodes=[],edges=[],cx=0,cy=0,scale=1,dragging=null,hovered=null;
let canvas,ctx,W,H;

async function load(){
const r=await fetch('/api/graph');
const g=await r.json();
nodes=(g.nodes||[]).slice(0,500).map((n,i)=>({
id:n.id,label:n.label||n.id,type:n.type||'default',
x:Math.random()*800-400,y:Math.random()*800-400,
vx:0,vy:0,community:n.community,radius:3+Math.min((n.session_count||1),20)*0.3
}));
const nodeIds=new Set(nodes.map(n=>n.id));
const nodeMap={};nodes.forEach(n=>nodeMap[n.id]=n);
edges=(g.edges||[]).filter(e=>nodeIds.has(e.source)&&nodeIds.has(e.target)).slice(0,1500).map(e=>({
source:nodeMap[e.source],target:nodeMap[e.target],
relation:e.relation,weight:e.effective_weight||0.5
}));
document.getElementById('info').textContent=nodes.length+' nodes · '+edges.length+' edges · drag nodes · scroll zoom · right-drag pan';
requestAnimationFrame(loop);
}

function forces(){
const repel=500,attract=0.005,damp=0.85,maxV=8;
for(const n of nodes){n.vx*=damp;n.vy*=damp}
for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
const f=repel/(d*d),fx=dx/d*f,fy=dy/d*f;
a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
}
for(const e of edges){
const dx=e.target.x-e.source.x,dy=e.target.y-e.source.y,d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
const f=d*attract*e.weight;
e.source.vx+=dx/d*f;e.source.vy+=dy/d*f;
e.target.vx-=dx/d*f;e.target.vy-=dy/d*f;
}
for(const n of nodes){n.vx-=n.x*0.0001;n.vy-=n.y*0.0001}
for(const n of nodes){if(n!==dragging){n.vx=Math.max(-maxV,Math.min(maxV,n.vx));n.vy=Math.max(-maxV,Math.min(maxV,n.vy));n.x+=n.vx;n.y+=n.vy}}
}

function worldToScreen(wx,wy){return[(wx+cx)*scale+W/2,(wy+cy)*scale+H/2]}
function screenToWorld(sx,sy){return[(sx-W/2)/scale-cx,(sy-H/2)/scale-cy]}

function findNode(sx,sy){
const[wx,wy]=screenToWorld(sx,sy);
for(let i=nodes.length-1;i>=0;i--){
const n=nodes[i],r=n.radius+4;
if(Math.abs(n.x-wx)<r&&Math.abs(n.y-wy)<r)return n;
}return null;}

function render(){
ctx.clearRect(0,0,W,H);
ctx.save();ctx.translate(W/2,H/2);ctx.scale(scale,scale);ctx.translate(cx,cy);
ctx.strokeStyle='rgba(48,54,61,0.4)';ctx.lineWidth=0.5/scale;
for(const e of edges){ctx.beginPath();ctx.moveTo(e.source.x,e.source.y);ctx.lineTo(e.target.x,e.target.y);ctx.stroke()}
ctx.strokeStyle='rgba(88,166,255,0.3)';ctx.lineWidth=1.5/scale;
for(const e of edges){if(e.weight>0.7){ctx.beginPath();ctx.moveTo(e.source.x,e.source.y);ctx.lineTo(e.target.x,e.target.y);ctx.stroke()}}
for(const n of nodes){
const r=n.radius,color=COLORS[n.type]||COLORS.default;
ctx.fillStyle=color;ctx.strokeStyle=n===hovered?'#fff':color;ctx.lineWidth=(n===hovered?3:1)/scale;
ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
if(scale>0.3||n===hovered){ctx.fillStyle='#c9d1d9';ctx.font=Math.max(8,10/scale)+'px system-ui';ctx.fillText(n.label.slice(0,20),n.x+r+3,n.y+4)}
}ctx.restore();}

let lastTime=0;
function loop(t){const dt=t-lastTime;lastTime=t;if(dt>16)for(let i=0;i<3;i++)forces();else forces();render();requestAnimationFrame(loop)}

canvas=document.getElementById('c');ctx=canvas.getContext('2d');
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

let lastX=0,lastY=0,panning=false;
canvas.addEventListener('mousedown',e=>{
const n=findNode(e.offsetX,e.offsetY);
if(n){dragging=n;n.vx=0;n.vy=0;return}
panning=true;lastX=e.offsetX;lastY=e.offsetY;
});
canvas.addEventListener('mousemove',e=>{
if(dragging){const[wx,wy]=screenToWorld(e.offsetX,e.offsetY);dragging.x=wx;dragging.y=wy;return}
if(panning){cx+=(e.offsetX-lastX)/scale;cy+=(e.offsetY-lastY)/scale;lastX=e.offsetX;lastY=e.offsetY;return}
hovered=findNode(e.offsetX,e.offsetY);
const tip=document.getElementById('tooltip');
if(hovered){tip.style.display='block';tip.style.left=(e.offsetX+16)+'px';tip.style.top=(e.offsetY-16)+'px';
tip.innerHTML='<b>'+hovered.label+'</b><br><span style="color:#8b949e">'+(TYPE_NAMES[hovered.type]||hovered.type)+' · community '+((hovered.community)||'?')+'</span>'}
else{tip.style.display='none'}
});
canvas.addEventListener('mouseup',()=>{dragging=null;panning=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();const ds=e.deltaY>0?0.9:1.1;scale=Math.max(0.05,Math.min(5,scale*ds))});

load();
</script></body></html>
