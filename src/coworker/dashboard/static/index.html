<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coworker — Analytics Dashboard</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-layout">
    <div class="topbar">
      <div class="topbar-search">
        <span class="topbar-search-icon">🔍</span>
        <input type="text" id="globalSearch" placeholder="Search sessions, projects, skills..." oninput="handleGlobalSearch(this.value)" />
      </div>
      <div class="topbar-status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">connected</span>
        <span class="topbar-sdk">SDK: opencode ✓ claude ✓</span>
      </div>
    </div>
    <main class="main" id="main">
      <div class="loading"><div class="spinner"></div><span>Loading dashboard...</span></div>
    </main>
  </div>
</div>
<script src="/dashboard.js"></script>
</body>
</html>
