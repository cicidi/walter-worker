[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walter-worker"
version = "0.1.0"
description = "Unified AI dev environment manager for Claude Code, Gemini CLI, and OpenCode"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
# openai and networkx are listed here as well as under [memory] because the test
# suite imports coworker.memory.llm and coworker.memory.query at module level,
# and both of those import their dependency at module level. Without them a
# `pip install -e ".[test]"` (what CI runs) fails at collection, not at run time.
# Keep these in step with [memory].
test = ["pytest", "httpx", "openai>=1.0", "networkx>=3.0"]
# Required by the `coworker memory` commands, not by the CLI itself - these are
# imported lazily so a base install does not need them. `graphify` is also
# required by `memory init`/`memory sync` but has no distribution, so it cannot
# be declared here; install it separately.
memory = [
    "openai>=1.0",
    "mem0ai>=0.1",
    "networkx>=3.0",
]

[project.scripts]
coworker = "coworker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "real: tests that require real API keys (DEEPSEEK_API_KEY) and external services",
    "integration: exercises real external services such as mem0; skipped when unavailable",
]

[tool.setuptools.package-data]
coworker = []
"coworker.dashboard" = ["static/**/*"]
